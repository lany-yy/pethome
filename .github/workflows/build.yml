name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for application files
        run: |
          if [ ! -f "main.py" ]; then
            echo "Error: main.py not found!"
            exit 1
          fi
          echo "Found main.py - application entry point exists"
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf automake libtool libtool-bin m4 \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev build-essential ninja-build libxcb-shape0 libxcb-xfixes0
      
      - name: Clean old buildozer cache
        run: |
          rm -rf ~/.buildozer || true
          rm -rf .buildozer || true
          rm -rf ~/.cache/pip || true
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython==0.29.36
          python -m pip install buildozer
          python -m pip install "kivy==2.1.0"
      
      - name: Setup Android SDK and Build-Tools
        run: |
          sudo apt install -y android-sdk-build-tools android-sdk
          mkdir -p ~/.android
          echo "count=0" > ~/.android/avd.ini
          echo "lastUsedApiLevel=34" >> ~/.android/avd.ini
      
      - name: Build APK
        run: |
          export CFLAGS="-O2"
          export LDFLAGS=""
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8
          export JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8"
          buildozer -v android debug
        timeout-minutes: 240
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pet-manager-apk
          path: bin/*.apk
          retention-days: 30
