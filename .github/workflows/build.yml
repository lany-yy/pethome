name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for application files
        run: |
          if [ ! -f "main.py" ]; then
            echo "Error: main.py not found!"
            exit 1
          fi
          echo "Found main.py - application entry point exists"
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # 关键修改：移除 setup-python，改用系统 Python
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3 python3-pip \
            build-essential automake autoconf \
            libtool pkg-config \
            zlib1g-dev libncurses5-dev libreadline-dev \
            libssl-dev libffi-dev \
            gawk gperf texinfo help2man \
            m4 libbz2-dev
      
      - name: Clean buildozer cache
        run: |
          rm -rf ~/.buildozer .buildozer ~/.android
          mkdir -p ~/.android
      
      - name: Create android SDK config
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/avd.ini
      
      - name: Install buildozer
        run: |
          pip3 install --upgrade pip setuptools wheel
          pip3 install cython buildozer
      
      - name: Build with buildozer
        run: |
          export JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8"
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8
          export CFLAGS="-O2 -fPIC"
          export CXXFLAGS="-O2 -fPIC"
          export LDFLAGS="-fPIC"
          # 关键修改：禁用 hostpython3 检查
          export P4A_IGNORE_HOSTPYTHON_MISMATCH=1
          buildozer -v android debug 2>&1 | tee build.log
        timeout-minutes: 300
      
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pet-manager-apk
          path: bin/*.apk
          retention-days: 30
