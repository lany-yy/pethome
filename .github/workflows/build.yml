name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for application files
        run: |
          if [ ! -f "main.py" ]; then
            echo "Error: main.py not found!"
            exit 1
          fi
          echo "Found main.py - application entry point exists"
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf automake libtool libtool-bin m4 \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev build-essential
      
      - name: Clean old buildozer cache
        run: |
          rm -rf ~/.buildozer || true
          rm -rf .buildozer || true
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython==0.29.37
          pip install buildozer==1.5.0
      
      - name: Setup Android SDK and Build-Tools
        run: |
          sudo apt install -y android-sdk-build-tools
          mkdir -p ~/.android
          echo "count=0" > ~/.android/avd.ini
          echo "lastUsedApiLevel=34" >> ~/.android/avd.ini
      
      - name: Initialize Buildozer spec if not exists
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "Initializing Buildozer spec file..."
            buildozer init
            # Configure the initialized spec file
            sed -i 's/app.name = MyApplication/app.name = PetManager/g' buildozer.spec
            sed -i 's/app.domain = org.yourapp/app.domain = com.petmanager/g' buildozer.spec
            sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.3.1/g' buildozer.spec
          else
            echo "Buildozer spec file already exists"
          fi
      
      - name: Build APK
        run: |
          export CFLAGS="-O2"
          export LDFLAGS=""
          buildozer -v android debug
        timeout-minutes: 180
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pet-manager-apk
          path: bin/*.apk
          compression-level: 0
